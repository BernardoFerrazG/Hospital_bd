{% extends 'base.html' %} {% block conteudo %}

<style>
  .landing {
    min-height: 70vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 48px 20px;
  }
  .card {
    max-width: 720px;
    width: 100%;
    text-align: center;
    padding: 36px;
    border-radius: 12px;
    box-shadow: 0 8px 28px rgba(0, 0, 0, 0.08);
    background: white;
  }
  .card h1 {
    margin: 0 0 12px;
    font-size: 2rem;
  }
  .card p.lead {
    color: #555;
    margin-bottom: 24px;
  }
  .btn-row {
    display: flex;
    gap: 12px;
    justify-content: center;
    flex-wrap: wrap;
  }
  .btn {
    padding: 10px 18px;
    border-radius: 8px;
    border: none;
    cursor: pointer;
    font-weight: 600;
    text-decoration: none;
  }
  .btn-primary {
    background: #0b76ef;
    color: white;
  }
  .btn-outline {
    background: transparent;
    border: 2px solid #0b76ef;
    color: #0b76ef;
  }
</style>

<div class="landing">
  <div class="card">
    <h1>Bem-vindo ao Hospital</h1>
    <p class="lead">
      Sistema de gestão hospitalar — cadastre-se ou faça login para continuar.
    </p>

    <div class="btn-row">
    </div>
  </div>
</div>

{% endblock %}
