{% extends 'base.html' %}
{% block conteudo %}
<div class="container py-4" style="max-width:720px;">
  <h2 class="mb-3">Cadastro de Médico</h2>

  <form action="{% url 'cadastro_medico' %}" method="post" class="row g-3">
    {% csrf_token %}
    <div class="col-12">
      <label class="form-label">Nome</label>
      <input name="nome" class="form-control" type="text" required placeholder="Nome completo" />
    </div>

    <div class="col-md-6">
      <label class="form-label">CPF</label>
      <input name="cpf" class="form-control" type="text" value="{{ cpf_prefill }}" required placeholder="Só números" />
      <div class="form-text">Informe o CPF (será usado como username).</div>
    </div>

    <div class="col-md-6">
      <label class="form-label">CRM</label>
      <input name="crm" class="form-control" type="text" required placeholder="Ex: 12345" />
    </div>

    <div class="col-md-4">
      <label class="form-label">Sexo</label>
      <input name="sexo" class="form-control" type="text" placeholder="M / F / Outro" />
    </div>

    <div class="col-md-4">
      <label class="form-label">Telefone</label>
      <input name="telefone" class="form-control" type="text" placeholder="(xx) xxxxx-xxxx" />
    </div>

    <div class="col-md-4">
      <label class="form-label">E-mail</label>
      <input name="email" class="form-control" type="email" placeholder="seu@exemplo.com" />
    </div>

    <div class="col-md-4">
      <label class="form-label">Data de nascimento</label>
      <input name="data_nascimento" class="form-control" type="date" />
    </div>

    <div class="col-md-4">
      <label class="form-label">Senha</label>
      <input name="senha" class="form-control" type="password" required />
    </div>

    <div class="col-md-4">
      <label class="form-label">Confirmar senha</label>
      <input name="senha_confirm" class="form-control" type="password" required />
    </div>

    <div class="col-12">
      <button class="btn btn-primary">Cadastrar Médico</button>
      <a href="{% url 'login_med' %}" class="btn btn-link">Voltar ao login</a>
    </div>
  </form>
</div>
{% endblock %}
