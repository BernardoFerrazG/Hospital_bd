<div class="table-container">
  <h1>Minhas Alocações</h1>

  <table class="aloc-table">
    <thead>
      <tr>
        <th>Local</th>
        <th>Data Início</th>
        <th>Data Fim</th>
        <th>Alocado Por</th>
      </tr>
    </thead>

    <tbody>
      {% if alocacoes %} {% for aloc in alocacoes %}
      <tr>
        <td>{{ aloc.local.nome }}</td>
        <td>{{ aloc.data_inicio }}</td>
        <td>{{ aloc.data_fim|default:"—" }}</td>
        <td>{{ aloc.alocado_por.usuario.username }}</td>
      </tr>
      {% endfor %} {% else %}
      <tr>
        <td colspan="4" class="no-data">Nenhuma alocação encontrada.</td>
      </tr>
      {% endif %}
    </tbody>
  </table>
</div>

<style>
  .table-container {
    max-width: 900px;
    margin: 32px auto;
    padding: 20px;
    background: #fff;
    border-radius: 8px;
    box-shadow: 0 2px 8px rgba(0, 0, 0, 0.06);
  }

  .table-container h1 {
    margin: 0 0 16px 0;
    font-size: 22px;
    color: #333;
    text-align: left;
  }

  .aloc-table {
    width: 100%;
    border-collapse: collapse;
    font-family: Arial, sans-serif;
  }

  .aloc-table thead th {
    text-align: left;
    padding: 12px 10px;
    background: #f5f7fb;
    border-bottom: 2px solid #e6e9ef;
    color: #2c3e50;
    font-weight: 600;
  }

  .aloc-table tbody td {
    padding: 12px 10px;
    border-bottom: 1px solid #eef0f4;
    color: #4a4a4a;
  }

  .aloc-table tbody tr:hover td {
    background: #fbfdff;
  }

  .aloc-table .no-data {
    text-align: center;
    padding: 18px;
    color: #777;
  }

  @media (max-width: 640px) {
    .table-container {
      padding: 12px;
    }
    .aloc-table thead {
      display: none;
    }
    .aloc-table tbody td {
      display: block;
      width: 100%;
      box-sizing: border-box;
    }
    .aloc-table tbody tr {
      margin-bottom: 12px;
      display: block;
      border: 1px solid #eee;
      border-radius: 6px;
    }
    .aloc-table tbody td::before {
      content: attr(data-label);
      font-weight: 600;
      display: inline-block;
      width: 120px;
    }
  }
</style>
