<h2 style="margin-bottom: 20px">Minhas Alocações</h2>

<table style="width: 100%; border-collapse: collapse; margin-top: 15px">
  <thead>
    <tr style="background: #f2f2f2">
      <th style="padding: 10px; border: 1px solid #ccc">Local</th>
      <th style="padding: 10px; border: 1px solid #ccc">Data de Início</th>
      <th style="padding: 10px; border: 1px solid #ccc">Data de Fim</th>
      <th style="padding: 10px; border: 1px solid #ccc">Alocado Por</th>
    </tr>
  </thead>

  <tbody>
    {% if alocacoes %} {% for aloc in alocacoes %}
    <tr>
      <td style="padding: 10px; border: 1px solid #ccc">
        {{ aloc.local.nome }}
      </td>
      <td style="padding: 10px; border: 1px solid #ccc">
        {{ aloc.data_inicio }}
      </td>
      <td style="padding: 10px; border: 1px solid #ccc">
        {{ aloc.data_fim|default:"—" }}
      </td>
      <td style="padding: 10px; border: 1px solid #ccc">
        {{ aloc.alocado_por.usuario.username }}
      </td>
    </tr>
    {% endfor %} {% else %}
    <tr>
      <td
        colspan="4"
        style="padding: 15px; text-align: center; border: 1px solid #ccc"
      >
        Nenhuma alocação encontrada.
      </td>
    </tr>
    {% endif %}
  </tbody>
</table>
