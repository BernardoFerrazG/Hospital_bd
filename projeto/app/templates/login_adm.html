<!DOCTYPE html>
<html lang="pt-br">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <title>Login do Administrador</title>

    <style>
      :root { --bs-primary: #005a9c; }

      body {
        background-color: #f4f7f6;
        height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .login-card {
        width: 100%;
        max-width: 420px;
        background: white;
        padding: 32px;
        border-radius: 14px;
        box-shadow: 0 4px 16px rgba(0,0,0,0.1);
      }

      .page-title {
        color: var(--bs-primary);
        font-weight: 600;
      }

      .btn-primary {
        background-color: var(--bs-primary);
        border-color: var(--bs-primary);
      }
    </style>
  </head>

  <body>

    <div class="login-card">

      <h2 class="page-title mb-3 text-center">Login</h2>
      <p class="text-muted text-center mb-4">Acesse sua conta administrativa</p>

      <form method="POST" action="{% url 'login_adm' %}">
        {% csrf_token %}

        <div class="mb-3">
          <label class="form-label">CPF</label>
          <input name = "cpf" type="text" maxlength="11" class="form-control" placeholder="Digite seu CPF" required>
        </div>

        <div class="mb-3">
          <label class="form-label">Senha</label>
          <input name = "senha"type="password" class="form-control" placeholder="Digite sua senha" required>
        </div>

        <button type="submit" class="btn btn-primary w-100 mt-2">
          Entrar
        </button>

      </form>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"></script>

  </body>
</html>
