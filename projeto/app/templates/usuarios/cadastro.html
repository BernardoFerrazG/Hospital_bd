{% extends 'usuarios/base.html' %}
{% block conteudo %}

<div class="form-container">
  <h1>Cadastro de usuário — teste</h1>

  <!-- FORM SIMPLES PARA TESTE -->
  <form id="form-cadastro" action="{% url 'cadastro' %}" method="POST" novalidate>
    {% csrf_token %}

    <label>Nome *</label>
    <input name="nome" type="text" required value="Teste Usuario">

    <label>CPF *</label>
    <input name="cpf" type="text" required value="12345678900">

    <label>Sexo</label>
    <input name="sexo" type="text" value="M">

    <label>Telefone</label>
    <input name="telefone" type="text" value="31999999999">

    <label>Email</label>
    <input name="email" type="email" value="a@b.com">

    <label>Data de Nascimento</label>
    <input name="data_nascimento" type="date">

    <label>Senha *</label>
    <input name="senha" type="password" required value="senha123">

    <label>Papel *</label>
    <select name="papel" required>
      <option value="">Selecione...</option>
      <option value="medico">Médico</option>
      <option value="enfermeiro">Enfermeiro</option>
      <option value="paciente">Paciente</option>
      <option value="admin">Admin</option>
    </select>

    <!-- botão submit normal -->
    <button id="btn-submit" type="submit">Próximo (POST)</button>
  </form>

  <p style="margin-top:12px; color:gray;">
    Observação: este é um formulário de teste — se isso enviar POST, o problema está no seu template original (JS/base).
  </p>
</div>

{% endblock %}
