{% extends 'base.html' %}
{% block conteudo %}
<div class="container py-4">
    
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2>Agendar Nova Consulta</h2>
        <a href="{% url 'home' %}" class="btn btn-outline-secondary">Voltar</a>
    </div>

    {% if messages %}
        {% for message in messages %}
            <div class="alert alert-{{ message.tags }} alert-dismissible fade show" role="alert">
                {{ message }}
                <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
            </div>
        {% endfor %}
    {% endif %}
    <hr>
    
    <div class="row">
        <div class="col-12 col-md-8">
            <p class="text-muted">Selecione o médico, a data e o horário desejado.</p>
            
            <form method="POST" action="{% url 'marcar_consulta' %}">
                {% csrf_token %}
                
                <div class="mb-3">
                    <label for="medico_consulta" class="form-label">Médico/Especialidade:</label>
                    <select id="medico_consulta" name="fmedico_crm" class="form-select" required>
                        <option value="">Selecione...</option>
                        {% for medico in medicos %}
                            <option value="{{ medico.crm }}">
                                Dr(a). {{ medico.mcpf.fcpf.nome }}
                            </option>
                        {% endfor %}
                    </select>
                </div>
                
                <div class="mb-3">
                    <label for="data_consulta" class="form-label">Data:</label>
                    <input type="date" id="data_consulta" name="data" class="form-control" required>
                </div>
                
                <div class="mb-3">
                    <label for="horario_consulta" class="form-label">Horário:</label>
                    <input type="time" id="horario_consulta" name="horario" class="form-control" required>
                </div>
                
                <button type="submit" class="btn btn-primary">Agendar Consulta</button>
            </form>
        </div>
    </div>
</div>
{% endblock %}
